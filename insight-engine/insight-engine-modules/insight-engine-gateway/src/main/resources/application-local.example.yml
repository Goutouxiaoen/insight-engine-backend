# =============================================================================
# 本地开发覆盖配置（application-local.example.yml）
#
# 用法：
#   1) 复制本文件为同目录 application-local.yml（已被 .gitignore 忽略，永不入库）
#   2) 把 127.0.0.1 换成实际 Nacos 地址（本机跑容器 → 127.0.0.1:8848；连云服务器 → 云 IP:8848）
#   3) 启动时激活 local profile：IDEA Run Configuration → Active profiles 填 local
#      （仓库已提供共享运行配置 .run/GatewayApplication (local).run.xml），
#      或程序参数 --spring.profiles.active=local
#
# 为什么网关也需要它：application.yml 里 Nacos 地址写成 ${NACOS_ADDR:127.0.0.1:8848}
#   —— 有默认值，所以**不会 fail-fast**，而是「静默连不上 Nacos」：
#   表现为 ① 启动日志刷 `Server check fail ... 127.0.0.1:9848`；
#   ② 停止时抛 `ERR_NACOS_DEREGISTER ... Client not connected, current status:STARTING`；
#   ③ `lb://` 路由不可用（拿不到实例清单）。属 PROGRESS §五 P1-1 的注入路径问题。
# =============================================================================
spring:
  cloud:
    nacos:
      # Nacos 2.x 自报端口并据此推导 gRPC 端口（主端口 + 1000），宿主须 1:1 映射 8848/9848
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
