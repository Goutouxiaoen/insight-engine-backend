# =============================================================================
# UMS 服务配置
# 端口 7101（PRD §9.2）；数据源/Redis 的主机与口令一律走环境变量注入（不写明文）：
#   INSIGHT_PG_HOST / INSIGHT_PG_PORT / INSIGHT_PG_DB / INSIGHT_PG_USERNAME / INSIGHT_PG_PASSWORD
#   INSIGHT_REDIS_HOST / INSIGHT_REDIS_PORT / INSIGHT_REDIS_PASSWORD
# 注入方式见 .env.example 末尾说明（推荐 application-local.yml 或 IDEA 环境变量）；
# 未注入时启动 fail-fast（占位符无法解析），这是有意设计，避免静默用空口令连库。
# 凭据纪律：AGENTS.md 铁律 5 / DEVGUIDE P19。
# =============================================================================
server:
  port: 7101

spring:
  application:
    name: insight-engine-ums
  cloud:
    # Nacos 注册中心/配置中心（地址走 NACOS_ADDR 环境变量注入，见 .env.example）
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # Nacos 不可达时只告警、不阻断启动（该属性默认 true，会导致服务直接起不来）
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # 配置中心暂未启用（配置仍落在 application.yml），关闭 import 强制校验，
        # 否则 Spring Cloud 2023 会因缺少 spring.config.import=nacos: 而启动失败。
        import-check:
          enabled: false
  datasource:
    url: jdbc:postgresql://${INSIGHT_PG_HOST}:${INSIGHT_PG_PORT}/${INSIGHT_PG_DB}
    username: ${INSIGHT_PG_USERNAME}
    password: ${INSIGHT_PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${INSIGHT_REDIS_HOST}
      port: ${INSIGHT_REDIS_PORT}
      password: ${INSIGHT_REDIS_PASSWORD}
      database: 0
      timeout: 3000

# MyBatis-Plus 基础配置
mybatis-plus:
  configuration:
    # 蛇形列名 → 驼峰属性自动映射（TD §5.1）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，生产关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置（insight.security.*，由 starter-security 读取）
# 密钥优先级：环境变量 INSIGHT_SECURITY_JWT_SECRET > 下方本地开发默认值；
# 生产禁止使用含 "change-me" 的开发默认值（starter 启动 fail-fast 拦截），必须注入独立随机密钥。
insight:
  security:
    jwt-secret: ${INSIGHT_SECURITY_JWT_SECRET:insight-engine-local-dev-secret-change-me-in-prod-2026-09}
    access-token-ttl-seconds: 7200      # 2 小时（TD §7.2）
    refresh-token-ttl-seconds: 604800   # 7 天（TD §7.2）
