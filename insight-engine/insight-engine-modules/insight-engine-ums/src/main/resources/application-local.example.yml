# =============================================================================
# 本机私有口令模板（application-local.example.yml）
#
# 用法（新机器 / 别人机器上跑）：
#   1) 把本文件复制为同目录 application-local.yml（该文件已被 .gitignore 忽略，永不入库）
#   2) 把 change-me-* 换成真实口令
#   3) 直接运行服务即可 —— application.yml 里已用 spring.config.import 自动加载本文件，
#      **不需要 Active profiles、不需要环境变量**
#
# 说明：
#   - 非敏感项（PG/Redis/Nacos 地址、库名、账号）已在 application.yml 里写死并加备注；
#   - application.yml **故意不写 password 键**：导入的文件优先级更低，写了会把它覆盖掉；
#   - 生产部署：不建本文件，改用环境变量 SPRING_DATASOURCE_PASSWORD / SPRING_DATA_REDIS_PASSWORD。
# =============================================================================
spring:
  datasource:
    password: change-me-pg-strong-random
  data:
    redis:
      password: change-me-redis-strong-random
